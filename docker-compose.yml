services:
  mdts:
    # Based on the upstream oven/bun:latest image.
    image: mdts-bun:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mdts
    init: true
    working_dir: /app
    # Hot-reload dev mode: the checkout is mounted straight into /app and the
    # entrypoint watches sources. Backend changes restart the server; frontend
    # changes rebuild the bundle and reload open browsers.
    entrypoint: ["/bin/bash", "/entrypoint-dev.sh"]

    environment:
      # Keep the dashboard starting in the real host home, while giving mdts a
      # writable directory for config.json and folders.json.
      HOME: "${HOME:?HOME must be set}"
      PORT: "8521"
      # Persist Bun's package cache in ./exp/bun-cache.
      BUN_INSTALL_CACHE_DIR: "/cache"
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"

    ports:
      # Local-only by default. Use "8521:8521" to expose it on the LAN.
      - "${MDTS_PORT:-8521}:8521"

    volumes:
      # The checkout itself, mounted read/write so watchers pick up host edits.
      # node_modules and dist are created inside the mount; both are gitignored.
      - .:/app
      # Bun package cache requested at ./exp/bun-cache.
      - ./exp/bun-cache:/cache
      # The rest of $HOME stays read-only; only mdts' config directory is
      # writable. This requires $HOME/.config to exist on the host.
      - ./exp/mdts-config:${HOME:?HOME must be set}/.config
      - ${HOME:?HOME must be set}:${HOME:?HOME must be set}:ro
      - ./docker/entrypoint-dev.sh:/entrypoint-dev.sh:ro
      # Copy-and-build-once mode (no mounting, no watch) kept for reference:
      # entrypoint: ["/bin/bash", "/entrypoint.sh"]
      - ./docker/entrypoint.sh:/entrypoint.sh:ro

    restart: unless-stopped
    stop_grace_period: 5s

    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8521/api/folders/info').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
