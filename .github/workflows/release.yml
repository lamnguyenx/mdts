name: Release to npm

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump (major, minor, or patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: ./packages/frontend
        run: bun install --frozen-lockfile

      - name: Update version
        run: |
          git config user.name "Yuji Ueki"
          git config user.email "unhappychoice@gmail.com"
          npm version ${{ github.event.inputs.version_type }}
          git push
          git push --tags

      - name: Update CHANGELOG
        id: changelog
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0)
          ENTRY=$(bash scripts/generate-changelog.sh "$VERSION_TAG")
          TMPFILE=$(mktemp)
          echo "# Changelog" > "$TMPFILE"
          echo "" >> "$TMPFILE"
          echo "$ENTRY" >> "$TMPFILE"
          echo "" >> "$TMPFILE"
          tail -n +2 CHANGELOG.md >> "$TMPFILE"
          mv "$TMPFILE" CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${VERSION_TAG}"
          git push
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          # Strip the leading "## vX.Y.Z" header line so the release body starts with the section content
          BODY=$(printf '%s\n' "$ENTRY" | tail -n +2)
          {
            echo 'body<<__CHANGELOG_EOF__'
            echo "$BODY"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.version_tag }}" \
            --title "${{ steps.changelog.outputs.version_tag }}" \
            --notes "${{ steps.changelog.outputs.body }}"

      - name: Build project
        run: bun run build

      - name: Build frontend
        run: bun run build:frontend

      - name: Publish to npm
        run: npx npm@11.5.1 publish
